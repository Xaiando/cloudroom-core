name: CI

on:
  push:
    branches: [main, windows-native]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Native Windows checks
        shell: pwsh
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/windows_native.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/windows_bee.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/windows_extensions.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/windows_launcher.py
          exit $LASTEXITCODE
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and exercise the native desktop window
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          dotnet publish integrations/windows/Cloudroom.Desktop.csproj -c Release -r win-x64 --self-contained true -o integrations/windows/publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -warnaserror
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/windows_gui.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./install/package-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cloud-Bee-Windows-alpha
          path: private/releases/Cloud-Bee-Windows-alpha.zip
          retention-days: 14
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Rust checks
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked
      - name: Disposable disk-safety and attachment checks
        run: |
          docker pull postgres:16-alpine
          sudo useradd --system --user-group --no-create-home cr-service-test
          sudo useradd --system --user-group --no-create-home cr-disk-test
          sudo python3 tests/storage_e2e.py --disposable --mixed
      - name: Client and fixture checks
        run: |
          python3 tests/preview_client.py
          node --test integrations/bb/client.test.ts
          python3 tests/install.py
          python3 tests/core_fixture.py
          python3 tests/pi_http.py
          python3 tests/workspaces.py
          python3 tests/sync_e2e.py
      - name: Disposable SSH preview checks
        run: sudo python3 tests/previews_ssh.py --disposable
      - name: Disposable PostgreSQL checks
        run: |
          python3 tests/core_e2e.py --foundation
          python3 tests/core_e2e.py --fixture
